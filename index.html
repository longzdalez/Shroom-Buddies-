<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081226">
<title>Shroom Buddies</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="splashing">
<div id="bg"></div>
<canvas id="sparkles" aria-hidden="true"></canvas>

<div id="splash" role="button" aria-label="Enter Shroom Buddies">
  <div class="glow"></div>
  <img class="logo" src="img/logo.svg" alt="">
  <div class="title">Shroom Buddies</div>
  <div class="sub">A Guide to Microdosing Psilocybin Mushrooms</div>
  <div class="tap">tap to enter</div>
</div>

<header>
  <div class="brand"><img src="img/logo.svg" alt=""><h1>Shroom Buddies</h1></div>
  <button id="settingsBtn" aria-label="Settings">⚙️</button>
</header>
<main id="view"></main>
<nav>
  <button data-view="today" class="active">🌱<span>Today</span></button>
  <button data-view="journal">📓<span>Journal</span></button>
  <button data-view="calendar">📅<span>Calendar</span></button>
  <button data-view="guides">📖<span>Guides</span></button>
</nav>
<script src="app.js"></script>
</body>
</html>
